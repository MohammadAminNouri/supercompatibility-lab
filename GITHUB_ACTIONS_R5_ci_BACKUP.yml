name: R5 Deployment + Scientific Validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scientific self-test + Streamlit boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify R5 files are actually on this commit
        shell: bash
        run: |
          set -euo pipefail
          test -f streamlit_app.py
          test -f research_selftest.py
          test -f requirements.txt
          grep -q "2026-08-29-r5-fresh-entrypoint" streamlit_app.py
          echo "R5 entrypoint confirmed on commit $GITHUB_SHA"

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile deployment files
        run: python -m py_compile streamlit_app.py research_selftest.py

      - name: Run deterministic scientific audit
        run: python research_selftest.py

      - name: Boot Streamlit and verify health
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > streamlit-r5.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          healthy=0
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qi 'ok'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Streamlit did not become healthy. Log follows:"
            cat streamlit-r5.log
            exit 1
          fi

          echo "STREAMLIT R5 HEALTH CHECK: PASS"
          tail -100 streamlit-r5.log || true

      - name: Upload Streamlit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-r5-log
          path: streamlit-r5.log
          if-no-files-found: ignore
